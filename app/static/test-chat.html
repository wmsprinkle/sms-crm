<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Test — SMS Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#F4F4F7; --surface:#fff; --line:#E7E7EE; --ink:#15151C;
    --muted:#6A6A78; --faint:#9A9AA8; --ai:#6D4AFF; --ai-soft:#EDE9FF;
    --green:#00C48C; --rose:#FF5C7A;
    --mono:'JetBrains Mono',monospace; --sans:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font-family:var(--sans);background:var(--canvas);display:flex;
       align-items:center;justify-content:center;padding:24px}

  .phone{
    width:400px;max-width:100%;height:min(760px,92vh);background:var(--surface);
    border:1px solid var(--line);border-radius:28px;display:flex;flex-direction:column;
    overflow:hidden;box-shadow:0 24px 60px -20px rgba(21,21,28,.25);
  }
  .head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;
        align-items:center;gap:12px;flex:0 0 auto}
  .logo{width:36px;height:36px;border-radius:11px;flex:0 0 auto;
        background:linear-gradient(135deg,var(--ai),#9B6BFF);
        display:grid;place-items:center}
  .logo span{width:12px;height:12px;border-radius:3px;background:#fff;transform:rotate(45deg)}
  .head b{font-size:15px} .head small{display:block;color:var(--faint);font-size:11.5px;margin-top:1px}
  .head .num{font-family:var(--mono)}
  .reset{margin-left:auto;font-size:11.5px;color:var(--muted);background:var(--canvas);
         border:none;border-radius:8px;padding:7px 11px;cursor:pointer;font-family:var(--sans);font-weight:500}
  .reset:hover{background:#EBEBF0}

  .status{padding:7px 18px;background:#FAFAFC;border-bottom:1px solid var(--line);
          font-size:11px;color:var(--faint);display:flex;gap:14px;flex:0 0 auto}
  .status b{color:var(--muted);font-weight:600}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;margin-right:5px}

  .thread{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;
          gap:10px;background:linear-gradient(180deg,#FCFCFD,#F7F7FA)}
  .msg{max-width:80%;display:flex;flex-direction:column;gap:3px}
  .msg .b{padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.45;white-space:pre-wrap}
  .msg .m{font-size:10px;color:var(--faint);padding:0 4px}
  .me{align-self:flex-end;align-items:flex-end}
  .me .b{background:var(--ink);color:#fff;border-bottom-right-radius:5px}
  .agent{align-self:flex-start}
  .agent .b{background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}
  .agent.draft .b{background:var(--ai-soft);border:1px dashed #CFC5FF;color:#3D2E99}
  .sys{align-self:center;font-size:11px;color:var(--faint);background:#fff;
       border:1px solid var(--line);border-radius:20px;padding:4px 13px}
  .typing{align-self:flex-start;display:flex;gap:4px;padding:12px 15px;background:#fff;
          border:1px solid var(--line);border-radius:16px;border-bottom-left-radius:5px}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--ai);opacity:.4;animation:bl 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes bl{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

  .composer{flex:0 0 auto;border-top:1px solid var(--line);padding:12px;display:flex;gap:9px;background:#fff}
  .composer input{flex:1;border:1px solid var(--line);border-radius:22px;padding:11px 16px;
                  font-family:var(--sans);font-size:14px;outline:none}
  .composer input:focus{border-color:var(--ai)}
  .composer button{width:44px;height:44px;border-radius:50%;border:none;background:var(--ai);
                   color:#fff;cursor:pointer;display:grid;place-items:center;flex:0 0 auto}
  .composer button:disabled{opacity:.45}
  .hint{text-align:center;font-size:10.5px;color:var(--faint);padding:0 0 10px;background:#fff}
</style>
</head>
<body>
<div class="phone">
  <div class="head">
    <div class="logo"><span></span></div>
    <div><b>Relay Agent</b><small class="num">+1 (813) 555-0100 · test mode</small></div>
    <button class="reset" onclick="resetChat()">Reset</button>
  </div>
  <div class="status">
    <span><span class="dot"></span>agent live</span>
    <span>status: <b id="st">engaged</b></span>
    <span>mode: <b id="mode">draft-hold</b></span>
  </div>
  <div class="thread" id="thread">
    <div class="sys">You're texting as the lead. The agent runs the real pipeline — no SMS is sent.</div>
  </div>
  <div class="composer">
    <input id="inp" placeholder="Text the agent…" autocomplete="off"
           onkeydown="if(event.key==='Enter')send()">
    <button id="btn" onclick="send()" title="Send">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </div>
  <div class="hint">DRAFT bubbles = held for approval (AUTO_SEND=false). Try “STOP” to test opt-out.</div>
</div>

<script>
const thread = document.getElementById('thread');
const inp = document.getElementById('inp');
const btn = document.getElementById('btn');

function add(cls, text, meta){
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.innerHTML = `<div class="b"></div><div class="m">${meta||''}</div>`;
  d.querySelector('.b').textContent = text;
  thread.appendChild(d);
  thread.scrollTop = thread.scrollHeight;
}
function sys(text){
  const d = document.createElement('div');
  d.className = 'sys'; d.textContent = text;
  thread.appendChild(d); thread.scrollTop = thread.scrollHeight;
}

let busy = false;
async function send(){
  const text = inp.value.trim();
  if(!text || busy) return;
  busy = true; btn.disabled = true; inp.value = '';
  add('me', text, 'you · lead');

  const t = document.createElement('div');
  t.className = 'typing'; t.innerHTML = '<i></i><i></i><i></i>';
  thread.appendChild(t); thread.scrollTop = thread.scrollHeight;

  try{
    const r = await fetch('/test-chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text})
    });
    const data = await r.json();
    t.remove();
    for(const m of (data.replies||[])){
      const draft = m.status === 'draft';
      add('agent' + (draft ? ' draft' : ''), m.body, draft ? 'agent · DRAFT (held)' : 'agent · sent');
    }
    if(!data.replies || !data.replies.length){
      sys('agent chose to wait');
    }
    document.getElementById('st').textContent = data.status;
    if(data.opted_out){ sys('Lead opted out — agent will send nothing further.'); }
  }catch(e){
    t.remove(); sys('error: ' + e.message);
  }
  busy = false; btn.disabled = false; inp.focus();
}

async function resetChat(){
  await fetch('/test-chat/reset', {method:'POST'});
  thread.innerHTML = '<div class="sys">Conversation reset. Fresh lead.</div>';
  document.getElementById('st').textContent = 'engaged';
}
inp.focus();
</script>
</body>
</html>
