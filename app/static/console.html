<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay — CRM Console</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--canvas:#F4F4F7;--surface:#fff;--shell:#171821;--line:#E7E7EE;--ink:#15151C;
--muted:#6A6A78;--faint:#9A9AA8;--ai:#6D4AFF;--ai-soft:#EDE9FF;--live:#00C48C;
--live-soft:#E1F8F0;--replied:#F5A623;--optout:#FF5C7A;--optout-soft:#FFE7EC;
--mono:'JetBrains Mono',monospace;--sans:'Inter',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);background:var(--canvas);color:var(--ink);font-size:14px;height:100vh;display:flex;flex-direction:column}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

header{background:var(--shell);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px}
.logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--ai),#9B6BFF);display:grid;place-items:center}
.logo span{width:9px;height:9px;border-radius:2px;background:#fff;transform:rotate(45deg)}
header b{font-size:15px}
header small{color:#9a9ab5;font-size:11px;display:block;margin-top:-1px}
.mode{margin-left:auto;font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;background:rgba(0,196,140,.15);color:#5ce8bd}
.mode.live{background:rgba(255,92,122,.18);color:#ff9bb0}

.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:14px 20px 4px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.stat .k{font-size:11px;color:var(--muted);font-weight:500;display:flex;gap:6px;align-items:center}
.stat .k i{width:7px;height:7px;border-radius:2px;display:inline-block}
.stat .v{font-family:var(--mono);font-size:22px;font-weight:700;margin-top:6px}

.wrap{flex:1;display:grid;grid-template-columns:280px 1fr 300px;gap:10px;padding:10px 20px 20px;min-height:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:11px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.phead{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.phead h3{margin:0;font-size:13px;font-weight:600}
.btn{border:none;border-radius:8px;padding:6px 12px;font-family:var(--sans);font-weight:600;font-size:12px;cursor:pointer;background:var(--ai);color:#fff}
.btn.ghost{background:var(--canvas);color:var(--ink)}
.btn.ok{background:var(--live)}
.btn.no{background:var(--optout)}
.btn:disabled{opacity:.5;cursor:default}

.list{overflow-y:auto;flex:1}
.lead{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px;align-items:center}
.lead:hover{background:#FAFAFC}
.lead.sel{background:var(--ai-soft);box-shadow:inset 3px 0 0 var(--ai)}
.av{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:600;font-size:12px;flex:0 0 auto}
.lead .nm{font-weight:600;font-size:13px}
.lead .ph{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.pill{margin-left:auto;font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:20px;flex:0 0 auto}
.s-engaged{background:#FDF1DC;color:#B9781A}.s-active{background:var(--ai-soft);color:var(--ai)}
.s-booked{background:var(--live-soft);color:#068A63}.s-opted_out{background:var(--optout-soft);color:#D83A5A}
.s-new{background:#eee;color:#6A6A78}

.thread{flex:1;overflow-y:auto;padding:16px;background:linear-gradient(180deg,#FCFCFD,#F8F8FB);display:flex;flex-direction:column;gap:10px}
.msg{max-width:75%;padding:9px 12px;border-radius:13px;font-size:13px;line-height:1.45}
.msg.in{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.out{align-self:flex-end;background:var(--ai);color:#fff;border-bottom-right-radius:4px}
.msg.draft{align-self:flex-end;background:#EEECFB;color:var(--ai);border:1px dashed #CFC5FF}
.msg .tag{display:block;font-size:9px;font-weight:700;opacity:.7;margin-bottom:3px;letter-spacing:.04em}
.composer{border-top:1px solid var(--line);padding:10px;display:flex;gap:8px}
.composer input{flex:1;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-family:var(--sans);font-size:13px;outline:none}
.composer input:focus{border-color:var(--ai)}
.hint{font-size:11px;color:var(--faint);padding:0 14px 10px}

.draft-item{padding:11px 14px;border-bottom:1px solid var(--line)}
.draft-item .body{font-size:12.5px;background:#EEECFB;color:var(--ai);border:1px dashed #CFC5FF;border-radius:9px;padding:8px 10px;margin:6px 0}
.draft-item .who{font-size:11px;color:var(--muted);font-weight:600}
.draft-item .row{display:flex;gap:6px;margin-top:6px}
.empty{padding:24px 14px;text-align:center;color:var(--faint);font-size:12px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--ai-soft);border-top-color:var(--ai);border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <div class="logo"><span></span></div>
  <div><b>Relay</b><small>Insurance CRM console</small></div>
  <span class="mode" id="mode">checking…</span>
</header>

<div class="metrics">
  <div class="stat"><div class="k"><i style="background:var(--faint)"></i>Contacts</div><div class="v" id="m-contacts">–</div></div>
  <div class="stat"><div class="k"><i style="background:var(--replied)"></i>Engaged</div><div class="v" id="m-engaged">–</div></div>
  <div class="stat"><div class="k"><i style="background:var(--live)"></i>Booked</div><div class="v" id="m-booked">–</div></div>
  <div class="stat"><div class="k"><i style="background:var(--optout)"></i>Opted out</div><div class="v" id="m-opted">–</div></div>
  <div class="stat"><div class="k"><i style="background:var(--ink)"></i>Sent</div><div class="v" id="m-sent">–</div></div>
</div>

<div class="wrap">
  <div class="panel">
    <div class="phead"><h3>Leads</h3><button class="btn" onclick="newLead()">+ Test lead</button></div>
    <div class="list" id="leads"></div>
  </div>

  <div class="panel">
    <div class="phead"><h3 id="thread-title">Select a lead</h3><span id="thread-status"></span></div>
    <div class="thread" id="thread"><div class="empty">Pick a lead to view the conversation, or create a test lead and talk to the agent.</div></div>
    <div class="hint" id="hint"></div>
    <div class="composer">
      <input id="box" placeholder="Type as the lead… (test mode)" disabled
             onkeydown="if(event.key==='Enter')sendMsg()">
      <button class="btn" id="sendbtn" onclick="sendMsg()" disabled>Send</button>
    </div>
  </div>

  <div class="panel">
    <div class="phead"><h3>Drafts awaiting approval</h3></div>
    <div class="list" id="drafts"></div>
  </div>
</div>

<script>
const AV=['#6D4AFF','#F5A623','#00C48C','#FF5C7A','#2B8CFF','#8B5CF6','#EC4899','#14B8A6'];
const avc=n=>{let s=0;for(const c of n||'?')s+=c.charCodeAt(0);return AV[s%AV.length]};
const ini=n=>(n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
let cur=null, dryRun=true;

async function j(url,opts){const r=await fetch(url,opts);if(!r.ok)throw new Error((await r.json().catch(()=>({}))).detail||r.status);return r.json()}

async function loadMetrics(){
  try{
    const m=await j('/contacts/metrics');
    m_contacts.textContent=m.contacts;
    m_engaged.textContent=m.by_status?.engaged||0;
    m_booked.textContent=(m.by_status?.booked||0);
    m_opted.textContent=m.by_status?.opted_out||0;
    m_sent.textContent=m.sent;
  }catch(e){}
}
const m_contacts=document.getElementById('m-contacts'),m_engaged=document.getElementById('m-engaged'),
m_booked=document.getElementById('m-booked'),m_opted=document.getElementById('m-opted'),m_sent=document.getElementById('m-sent');

async function loadLeads(){
  const rows=await j('/contacts');
  const el=document.getElementById('leads');
  if(!rows.length){el.innerHTML='<div class="empty">No leads yet. Import a CSV or create a test lead.</div>';return}
  el.innerHTML=rows.map(c=>`
    <div class="lead ${c.id===cur?'sel':''}" onclick="pick(${c.id},'${(c.name||'Lead').replace(/'/g,"")}')">
      <div class="av" style="background:${avc(c.name||'L')}">${ini(c.name||'L')}</div>
      <div><div class="nm">${c.name||'(no name)'}</div><div class="ph">${c.phone}</div></div>
      <span class="pill s-${c.status}">${c.status.replace('_',' ')}</span>
    </div>`).join('');
}

async function pick(id,name){
  cur=id;
  document.getElementById('thread-title').textContent=name;
  document.getElementById('box').disabled=!dryRun;
  document.getElementById('sendbtn').disabled=!dryRun;
  document.getElementById('hint').textContent=dryRun?'Test mode: you are typing as the lead. Agent replies run through the real pipeline; nothing is texted.':'Live mode: test chat disabled.';
  await Promise.all([loadThread(),loadLeads()]);
}

async function loadThread(){
  if(!cur)return;
  const msgs=await j(`/contacts/${cur}/thread`);
  const el=document.getElementById('thread');
  el.innerHTML=msgs.length?msgs.map(m=>{
    const cls=m.direction==='in'?'in':(m.status==='draft'?'draft':'out');
    const tag=m.direction==='in'?'LEAD':(m.status==='draft'?'AGENT · DRAFT':'AGENT');
    return `<div class="msg ${cls}"><span class="tag">${tag}</span>${m.body}</div>`;
  }).join(''):'<div class="empty">No messages yet — say something as the lead.</div>';
  el.scrollTop=el.scrollHeight;
}

async function newLead(){
  const name=prompt('Test lead first name:','Alex');if(name===null)return;
  const c=await j('/testchat/new',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:name||'Alex',company:'Northgate'})});
  await loadLeads();await loadMetrics();
  pick(c.id,c.name);
}

async function sendMsg(){
  const box=document.getElementById('box');
  const text=box.value.trim();
  if(!text||!cur)return;
  box.value='';box.disabled=true;
  document.getElementById('sendbtn').innerHTML='<span class="spin"></span>';
  try{
    await j(`/testchat/${cur}/message`,{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
  }catch(e){alert('Error: '+e.message)}
  box.disabled=false;box.focus();
  document.getElementById('sendbtn').textContent='Send';
  await Promise.all([loadThread(),loadDrafts(),loadMetrics(),loadLeads()]);
}

async function loadDrafts(){
  const rows=await j('/contacts/drafts');
  const el=document.getElementById('drafts');
  if(!rows.length){el.innerHTML='<div class="empty">No drafts. When AUTO_SEND=false, agent replies wait here for your approval.</div>';return}
  el.innerHTML=rows.map(d=>`
    <div class="draft-item">
      <div class="who">Contact #${d.contact_id}</div>
      <div class="body">${d.body}</div>
      <div class="row">
        <button class="btn ok" onclick="approve(${d.id})">Approve &amp; send</button>
        <button class="btn no" onclick="discard(${d.id})">Discard</button>
      </div>
    </div>`).join('');
}
async function approve(id){try{await j(`/drafts/${id}/approve`,{method:'POST'})}catch(e){alert(e.message)}
  await Promise.all([loadDrafts(),loadThread(),loadMetrics()])}
async function discard(id){await j(`/drafts/${id}/discard`,{method:'POST'});
  await Promise.all([loadDrafts(),loadThread()])}

async function boot(){
  try{
    const h=await j('/health');
    dryRun=h.dry_run;
    const m=document.getElementById('mode');
    m.textContent=dryRun?'DRY RUN — nothing is texted':'LIVE';
    m.classList.toggle('live',!dryRun);
  }catch(e){}
  await Promise.all([loadMetrics(),loadLeads(),loadDrafts()]);
  setInterval(()=>{loadMetrics();loadDrafts()},8000);
}
boot();
</script>
</body>
</html>
